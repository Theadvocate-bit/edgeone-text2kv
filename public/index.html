<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeOne Makers Text2KV Admin</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f9f9fb; color: #333; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0052d9; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #003ebb; }
        pre { background: #272822; color: #f8f8f2; padding: 12px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>EdgeOne Makers Text2KV 控制台</h2>
        <label>Admin Token:</label>
        <input type="password" id="token" placeholder="输入你在 EdgeOne Makers 设置的 ADMIN_TOKEN">
        <button onclick="loadList()">加载数据列表</button>
    </div>

    <div class="card">
        <h3>数据控制台输出</h3>
        <pre id="output">等待操作...</pre>
    </div>

    <script>
        async function loadList() {
            const token = document.getElementById('token').value.trim();
            const output = document.getElementById('output');
            if (!token) return alert('请输入 Token！');

            output.innerText = '正在请求...';
            try {
                const res = await fetch(`/api/list?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                output.innerText = JSON.stringify(data, null, 2);
            } catch (e) {
                output.innerText = '请求失败: ' + e.message;
            }
        }
    </script>
</body>
</html>
